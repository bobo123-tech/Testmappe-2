<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Notruf Hamburg | Verwaltung</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0a0d13; --bg2:#0f1420; --card:rgba(255,255,255,.045); --card-b:rgba(255,255,255,.09);
  --accent:#e2231a; --accent2:#2f6fed; --text:#e9edf5; --dim:#8a93a8; --success:#2ecc71;
  --warning:#f5a623; --danger:#e74c3c; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}
.hidden{display:none !important;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2a3140;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOGIN ---------- */
#loginPage{
  min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative;
  background:
    linear-gradient(180deg,rgba(6,8,14,.75),rgba(6,8,14,.92)),
    url('https://source.unsplash.com/1600x1000/?hamburg,city,night') center/cover no-repeat fixed;
}
.login-card{
  width:400px; max-width:92vw; padding:38px 34px; border-radius:22px;
  background:rgba(15,20,32,.65); border:1px solid var(--card-b); backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.55); animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.login-logo .badge-icon{
  width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#8e1410);
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(226,35,26,.4);
}
.login-logo h1{font-size:19px;font-weight:700;}
.login-logo span{display:block;font-size:12px;color:var(--dim);}
.login-card h2{margin:22px 0 6px;font-size:15px;color:var(--dim);font-weight:500;}
.login-error{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.4);color:#ff8a7a;padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;}
.demo-box{margin-top:20px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px dashed var(--card-b);font-size:11.5px;color:var(--dim);line-height:1.6;}
.demo-box b{color:#b8c2d6;}

/* ---------- FORM ELEMENTS ---------- */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
.input,.select,textarea{
  width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--card-b);
  background:rgba(255,255,255,.03); color:var(--text); font-size:14px; outline:none; transition:.2s;
}
.input:focus,.select:focus,textarea:focus{border-color:var(--accent2);background:rgba(47,111,237,.06);box-shadow:0 0 0 3px rgba(47,111,237,.15);}
textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn{
  border:none;padding:11px 18px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;gap:8px;transition:.2s;letter-spacing:.2px;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--accent2),#1c4fc7);color:#fff;box-shadow:0 6px 18px rgba(47,111,237,.35);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-red{background:linear-gradient(135deg,var(--accent),#8e1410);color:#fff;box-shadow:0 6px 18px rgba(226,35,26,.35);}
.btn-red:hover{filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--card-b);}
.btn-ghost:hover{background:rgba(255,255,255,.11);}
.btn-full{width:100%;justify-content:center;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}

/* ---------- APP LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:265px;min-width:265px;background:linear-gradient(180deg,#0d111a,#0a0d14);
  border-right:1px solid var(--card-b);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:50;
}
.sidebar-head{padding:22px 20px;border-bottom:1px solid var(--card-b);display:flex;gap:12px;align-items:center;}
.sidebar-head .badge-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8e1410);display:flex;align-items:center;justify-content:center;font-size:19px;}
.sidebar-head h1{font-size:15px;font-weight:700;}
.sidebar-head span{font-size:11px;color:var(--dim);}
.nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;margin-bottom:4px;cursor:pointer;
  color:var(--dim);font-size:13.5px;font-weight:600;border-left:3px solid transparent;transition:.2s;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);transform:translateX(2px);}
.nav-item.active{background:linear-gradient(90deg,rgba(226,35,26,.16),transparent);color:#fff;border-left:3px solid var(--accent);}
.nav-icon{width:20px;text-align:center;}
.sidebar-foot{padding:14px;border-top:1px solid var(--card-b);}
#mainArea{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:68px;border-bottom:1px solid var(--card-b);display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;background:rgba(10,13,19,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:40;gap:20px;
}
#globalSearch{max-width:340px;}
.menuBtn{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.profile-chip{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid var(--card-b);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),#1c4fc7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.profile-chip .pname{font-size:13px;font-weight:700;}
.profile-chip .prole{font-size:10.5px;color:var(--dim);}
#content{padding:26px;flex:1;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- CARDS / GLASS ---------- */
.glass{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25);}
.page-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title h2{font-size:22px;font-weight:700;}
.page-title p{font-size:13px;color:var(--dim);margin-top:2px;}
.hero{
  border-radius:20px;overflow:hidden;position:relative;margin-bottom:24px;min-height:150px;display:flex;align-items:center;
  background:linear-gradient(120deg,rgba(226,35,26,.25),rgba(47,111,237,.2)),url('https://source.unsplash.com/1600x500/?hamburg,skyline') center/cover;
  padding:28px 34px;border:1px solid var(--card-b);
}
.hero h2{font-size:24px;margin-bottom:6px;}
.hero p{color:#dfe3ec;font-size:13.5px;max-width:560px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:24px;}
.stat-card{padding:20px;transition:.25s;}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.4);}
.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.stat-num{font-size:26px;font-weight:800;}
.stat-label{font-size:12.5px;color:var(--dim);margin-top:2px;}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
.card-title{font-size:14.5px;font-weight:700;padding:18px 20px;border-bottom:1px solid var(--card-b);display:flex;justify-content:space-between;align-items:center;}
.activity-item{padding:13px 20px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;display:flex;gap:10px;}
.activity-item:last-child{border:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-top:6px;flex-shrink:0;}
.activity-item .meta{color:var(--dim);font-size:11px;margin-top:3px;}

/* ---------- TABLE ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.toolbar .input,.toolbar .select{width:auto;min-width:160px;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;padding:13px 16px;background:rgba(255,255,255,.04);color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
tbody td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;}
tbody tr{transition:.15s;}
tbody tr:hover{background:rgba(255,255,255,.03);}
td.empty{text-align:center;color:var(--dim);padding:34px;white-space:normal;}
.pagination{display:flex;gap:6px;justify-content:flex-end;padding:14px 4px;flex-wrap:wrap;}
.pagination button{width:32px;height:32px;border-radius:8px;border:1px solid var(--card-b);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;}
.pagination button.active{background:var(--accent2);border-color:var(--accent2);}

/* ---------- BADGES ---------- */
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.badge-gold{background:rgba(255,196,0,.15);color:#ffc400;border:1px solid rgba(255,196,0,.4);}
.badge-purple{background:rgba(155,89,255,.15);color:#b98bff;border:1px solid rgba(155,89,255,.4);}
.badge-blue{background:rgba(47,111,237,.15);color:#6ea8ff;border:1px solid rgba(47,111,237,.4);}
.badge-gray{background:rgba(255,255,255,.08);color:#aab2c0;border:1px solid rgba(255,255,255,.15);}
.badge-red{background:rgba(231,76,60,.15);color:#ff6b5b;border:1px solid rgba(231,76,60,.4);}
.badge-green{background:rgba(46,204,113,.15);color:#4ee089;border:1px solid rgba(46,204,113,.4);}

/* ---------- MODAL / TOAST ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;}
.modal-overlay.active{display:flex;animation:fadeIn .2s ease;}
.modal-box{width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:26px;}
.modal-box h3{margin-bottom:18px;font-size:17px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
#toastContainer{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slideIn .3s ease;min-width:220px;}
@keyframes slideIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.toast.success{background:linear-gradient(135deg,#1e5f3c,#134527);border:1px solid rgba(46,204,113,.5);}
.toast.error{background:linear-gradient(135deg,#6b1f18,#4a1310);border:1px solid rgba(231,76,60,.5);}
.toast.info{background:linear-gradient(135deg,#1a3a6b,#122a4d);border:1px solid rgba(47,111,237,.5);}

.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--card-b);background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;font-weight:600;color:var(--dim);}
.tab-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.profile-header{display:flex;gap:22px;align-items:center;padding:24px;flex-wrap:wrap;}
.profile-avatar{width:78px;height:78px;border-radius:20px;background:linear-gradient(135deg,var(--accent2),#1c4fc7);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;}
.profile-info h2{font-size:20px;margin-bottom:4px;}
.profile-info p{font-size:12.5px;color:var(--dim);}
.pill-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.top3{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.top3-card{flex:1;min-width:180px;padding:20px;text-align:center;position:relative;}
.top3-card.rank1{border:1px solid rgba(255,196,0,.5);box-shadow:0 0 30px rgba(255,196,0,.15);}
.top3-card.rank2{border:1px solid rgba(200,200,210,.4);}
.top3-card.rank3{border:1px solid rgba(180,110,50,.4);}
.top3-medal{font-size:30px;}
.top3-card h4{margin-top:6px;font-size:15px;}
.top3-card p{font-size:11.5px;color:var(--dim);margin-top:2px;}
.top3-num{font-size:24px;font-weight:800;margin-top:8px;color:#fff;}

@media(max-width:900px){
  #sidebar{position:fixed;left:-280px;top:0;transition:.3s;box-shadow:0 0 40px rgba(0,0,0,.6);}
  #sidebar.open{left:0;}
  .menuBtn{display:block;}
  .grid2{grid-template-columns:1fr;}
  #globalSearch{display:none;}
  .row2{grid-template-columns:1fr;}
}
</style>
</head>

<script>
/* ================= ROLLEN-HIERARCHIE ================= */
const ROLES = ["Owner","Co. Owner","Supervisor","Leitungs Ebene","Projektleitung","Stv. Projektleitung",
"Highteam-Leitung","High Rank","Director","Manager","Stv. Manager","Designing Manager","Servermanagement",
"Stv. Servermanagement","LTD.Teamleitung","Teamleitung","Stv. Teamleitung","Highteam","Ausbilder","Stv. Ausbilder",
"Event Manager - Leitung","Event Manager","Fraktionverwaltung - Leitung","Fraktionverwaltung","Verwaltung",
"Ebene Admin","LTD.Administrator","Head Administrator","Sr. Administrator","Admin","Jr. Admin","Head Mod","Mod",
"Jr. Mod","Head Supporter","Supporter","Test Supporter"];

function roleLevel(role){ const i=ROLES.indexOf(role); return i===-1?0:ROLES.length-i; }
const FULL_ACCESS_LEVEL = roleLevel("Stv. Projektleitung");
const MOD_ACCESS_LEVEL = roleLevel("Jr. Mod");
function hasFullAccess(u){ return u && roleLevel(u.role)>=FULL_ACCESS_LEVEL; }
function hasModAccess(u){ return u && roleLevel(u.role)>=MOD_ACCESS_LEVEL; }
function roleBadgeClass(role){
  const l=roleLevel(role);
  if(l>=roleLevel("Highteam-Leitung")) return "badge-gold";
  if(l>=roleLevel("Verwaltung")) return "badge-purple";
  if(l>=roleLevel("Jr. Mod")) return "badge-blue";
  return "badge-gray";
}
function canEditTarget(actor,targetRole){
  if(!hasFullAccess(actor)) return false;
  if(actor.role==="Owner") return true;
  return roleLevel(actor.role) > roleLevel(targetRole);
}
function roleOptions(actor,current){
  const maxLvl = actor.role==="Owner" ? Infinity : roleLevel(actor.role);
  return ROLES.filter(r=> actor.role==="Owner" ? true : roleLevel(r)<maxLvl)
    .map(r=>`<option value="${r}" ${r===current?"selected":""}>${r}</option>`).join("");
}

/* ================= HELPERS ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function fmtDateDE(iso){ if(!iso) return "-"; const d=new Date(iso); return d.toLocaleDateString("de-DE"); }
function nowDateStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTimeStr(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function initials(name){ return (name||"?").split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase(); }

/* ================= DB ================= */
function loadDB(){ return JSON.parse(localStorage.getItem("nrhh_db")); }
function saveDB(db){ localStorage.setItem("nrhh_db", JSON.stringify(db)); }

async function buildSeed(){
  const demoUsers = [
    {u:"owner",p:"owner123",role:"Owner",discord:"@ChefBoss",did:"100000000000000001"},
    {u:"coowner",p:"coowner123",role:"Co. Owner",discord:"@ZweiterChef",did:"100000000000000002"},
    {u:"projektleitung",p:"projekt123",role:"Projektleitung",discord:"@ProjektLeiterTim",did:"100000000000000003"},
    {u:"stvprojekt",p:"stv123",role:"Stv. Projektleitung",discord:"@StvProjektAnna",did:"100000000000000004"},
    {u:"teamleitung",p:"team123",role:"Teamleitung",discord:"@TeamLeadPhil",did:"100000000000000005"},
    {u:"servermanagement",p:"server123",role:"Servermanagement",discord:"@ServerNina",did:"100000000000000006"},
    {u:"headadmin",p:"headadmin123",role:"Head Administrator",discord:"@HeadAdminJan",did:"100000000000000007"},
    {u:"admin",p:"admin123",role:"Admin",discord:"@AdminMax",did:"100000000000000008"},
    {u:"jrmod",p:"jrmod123",role:"Jr. Mod",discord:"@JuniorModeLena",did:"100000000000000009"},
    {u:"headsupporter",p:"support123",role:"Head Supporter",discord:"@HeadSupportTom",did:"100000000000000010"},
    {u:"supporter",p:"supporter123",role:"Supporter",discord:"@SupportLisa",did:"100000000000000011"},
    {u:"testsupporter",p:"test123",role:"Test Supporter",discord:"@TestNeuling",did:"100000000000000012"},
  ];
  const users=[];
  for(let i=0;i<demoUsers.length;i++){
    const d=demoUsers[i];
    users.push({id:uid(),username:d.u,passwordHash:await sha256(d.p),discord:d.discord,discordId:d.did,role:d.role,active:true,createdAt:"2024-02-1"+(i%9)});
  }
  const players=[
    {id:uid(),robloxName:"xXPoliceMaxXx",discordName:"@MaxSpieler",discordId:"200000000000000001",role:"Bürger",createdAt:"2024-03-01"},
    {id:uid(),robloxName:"FeuerLisa07",discordName:"@LisaFire",discordId:"200000000000000002",role:"Bürger",createdAt:"2024-03-05"},
    {id:uid(),robloxName:"RettungsTom",discordName:"@TomRescue",discordId:"200000000000000003",role:"Verwaltung",createdAt:"2024-03-08"},
    {id:uid(),robloxName:"HamburgKevin",discordName:"@KevinHH",discordId:"200000000000000004",role:"Bürger",createdAt:"2024-04-11"},
    {id:uid(),robloxName:"PolizeiJulia",discordName:"@JuliaPD",discordId:"200000000000000005",role:"Ausbilder",createdAt:"2024-04-20"},
    {id:uid(),robloxName:"Störenfried99",discordName:"@Chaot99",discordId:"200000000000000006",role:"Bürger",createdAt:"2024-05-02"},
    {id:uid(),robloxName:"SanitäterEmma",discordName:"@EmmaSan",discordId:"200000000000000007",role:"Bürger",createdAt:"2024-05-15"},
    {id:uid(),robloxName:"RegelbrecherX",discordName:"@RegelbrecherX",discordId:"200000000000000008",role:"Bürger",createdAt:"2024-06-01"},
    {id:uid(),robloxName:"NightHawkFD",discordName:"@NightHawk",discordId:"200000000000000009",role:"Fraktionverwaltung",createdAt:"2024-06-10"},
    {id:uid(),robloxName:"BäckerBernd",discordName:"@BerndBaeck",discordId:"200000000000000010",role:"Bürger",createdAt:"2024-06-22"},
  ];

/* ================= AUTH ================= */
function currentUser(){
  const s = sessionStorage.getItem("nrhh_session");
  if(!s) return null;
  const {id} = JSON.parse(s);
  const db = loadDB();
  const u = db.users.find(x=>x.id===id && x.active);
  return u||null;
}
async function handleLogin(e){
  e.preventDefault();
  const uEl=document.getElementById("loginUser"), pEl=document.getElementById("loginPass");
  const db = loadDB();
  const hash = await sha256(pEl.value);
  const user = db.users.find(x=>x.username.toLowerCase()===uEl.value.trim().toLowerCase());
  const box = document.getElementById("loginErrorBox");
  if(!user || !user.active || user.passwordHash!==hash){
    box.innerHTML = `<div class="login-error">❌ Benutzername oder Passwort falsch, oder Konto deaktiviert.</div>`;
    return false;
  }
  box.innerHTML="";
  sessionStorage.setItem("nrhh_session", JSON.stringify({id:user.id}));
  addLog(user,"Login","-");
  location.hash="dashboard";
  route();
  return false;
}
function logout(){
  const u = currentUser();
  if(u) addLog(u,"Logout","-");
  sessionStorage.removeItem("nrhh_session");
  location.hash="";
  route();
}
function addLog(user,action,target){
  const db = loadDB();
  db.logs.unshift({id:uid(),user:user.username,role:user.role,action,target,date:new Date().toLocaleDateString("de-DE"),time:new Date().toTimeString().slice(0,5),ts:Date.now()});
  saveDB(db);
}

/* ================= TOAST / MODAL ================= */
function toast(msg,type="success"){
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  const icon = type==="success"?"✅":type==="error"?"⚠️":"ℹ️";
  t.innerHTML = `${icon} ${msg}`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition=".3s"; setTimeout(()=>t.remove(),300); },2800);
}
function openModal(html){
  const o = document.getElementById("modalOverlay");
  o.innerHTML = `<div class="glass modal-box">${html}</div>`;
  o.classList.add("active");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("active"); }

  if(["warns","kicks","bans"].includes(page)) return hasModAccess(u);

}

function route(){
  const u = currentUser();
  if(!u){ showLogin(); return; }
  showApp();
  const raw = (location.hash.replace("#","")||"dashboard");
  const [page,param] = raw.split("/");
  const checkPage = page==="player" ? "players" : page;
  if(!canView(checkPage)){
    toast("Kein Zugriff auf diesen Bereich.","error");
    location.hash="dashboard"; return;
  }
  buildSidebar(); renderTopbar();
  const map = {dashboard:renderDashboard,players:renderPlayers,player:()=>renderPlayerProfile(param),
    warns:renderWarns,kicks:renderKicks,bans:renderBans,leaderboard:renderLeaderboard,
    rights:renderRights,users:renderUsers,logs:renderLogs,settings:renderSettings};
  (map[page]||renderDashboard)();
}

/* ================= TABLE HELPERS ================= */
function tableHtml(headers,rows){
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}" class="empty">📭 Keine Daten vorhanden</td></tr>`}</tbody></table></div>`;
}
function paginationHtml(total,page,ps,fn){
  const pages = Math.max(1,Math.ceil(total/ps));
  let html = `<div class="pagination">`;
  for(let i=1;i<=pages;i++) html += `<button class="${page===i?"active":""}" onclick="${fn}(${i})">${i}</button>`;
  return html+"</div>";
}
function paginate(arr,page,ps){ return arr.slice((page-1)*ps,(page-1)*ps+ps); }

/* ================= BAN STATUS ================= */
function computeBanStatus(ban){
  if(ban.type==="permanent") return "Permanent";
  return new Date() < new Date(ban.endDateTime) ? "Aktiv" : "Abgelaufen";
}
function banBadge(status){
  if(status==="Aktiv") return `<span class="badge badge-red">Aktiv</span>`;
  if(status==="Permanent") return `<span class="badge badge-purple">Permanent</span>`;
  return `<span class="badge badge-green">Abgelaufen</span>`;
}

/* ================= PLAYERS ================= */
function findOrCreatePlayer(robloxName,extra={}){
  const db = loadDB();
  let p = db.players.find(x=>x.robloxName.toLowerCase()===robloxName.toLowerCase());
  if(!p){
    p = {id:uid(),robloxName,discordName:extra.discordName||"-",discordId:extra.discordId||"-",role:extra.role||"Bürger",createdAt:nowDateStr()};
    db.players.push(p); saveDB(db);
  } else if(extra.role){
    p.role = extra.role;
    if(extra.discordName) p.discordName = extra.discordName;
    if(extra.discordId) p.discordId = extra.discordId;
    saveDB(db);
  }
  return p;
}
function renderPlayers(){
  const db = loadDB(); const u = currentUser();
  let list = db.players.filter(p=>{
    const f = state.playerFilter.toLowerCase();
    return !f || p.robloxName.toLowerCase().includes(f) || p.discordName.toLowerCase().includes(f) || p.discordId.includes(f);
  });
  const rows = paginate(list,state.page.players,state.PS).map(p=>{
    const warnCount = db.warns.filter(w=>w.playerId===p.id).length;
    const activeBan = db.bans.find(b=>b.playerId===p.id && (computeBanStatus(b)==="Aktiv"||computeBanStatus(b)==="Permanent"));
    return `<tr>
      <td><b>${p.robloxName}</b></td><td>${p.discordName}</td><td>${p.discordId}</td>
      <td><span class="badge ${roleBadgeClass(p.role)}">${p.role}</span></td>
      <td>${warnCount}</td>
      <td>${activeBan?banBadge(computeBanStatus(activeBan)):`<span class="badge badge-gray">Kein Ban</span>`}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="location.hash='player/${p.id}'">Profil ansehen</button></td>
    </tr>`;
  });
  document.getElementById("content").innerHTML = `
  <div class="page-title"><div><h2>👥 Spielerverwaltung</h2><p>Suche &amp; verwalte alle registrierten Spieler.</p></div>
  ${hasModAccess(u)?`<button class="btn btn-primary" onclick="openAddPlayerModal()">+ Spieler hinzufügen</button>`:""}</div>

  const startDate = document.getElementById("bDate").value, startTime = document.getElementById("bTime").value;
  let duration=null,durationUnit=null,endDateTime=null;
  if(type==="temporary"){
    duration = Number(document.getElementById("bDuration").value);
    durationUnit = document.getElementById("bUnit").value;
    const start = new Date(`${startDate}T${startTime}`);
    const end = new Date(start);
    if(durationUnit==="hours") end.setHours(end.getHours()+duration);
    else if(durationUnit==="days") end.setDate(end.getDate()+duration);
    else if(durationUnit==="weeks") end.setDate(end.getDate()+duration*7);
    else if(durationUnit==="months") end.setMonth(end.getMonth()+duration);
    endDateTime = end.toISOString();
  }
  const db = loadDB();
  db.bans.unshift({id:uid(),playerId:pl.id,player,reason:document.getElementById("bReason").value,type,
    startDate,startTime,duration,durationUnit,endDateTime,moderator:u.username,note:document.getElementById("bNote").value});

/* ================= LEADERBOARD ================= */
function renderLeaderboard(){
  const db = loadDB();
  const counts = {};
  function bump(name,role,key){ counts[name] = counts[name]||{name,role,warns:0,kicks:0,bans:0,total:0}; counts[name][key]++; counts[name].total++; }
  db.warns.forEach(w=>bump(w.moderator, findUserRole(w.moderator),"warns"));
  db.kicks.forEach(k=>bump(k.moderator, findUserRole(k.moderator),"kicks"));
  db.bans.forEach(b=>bump(b.moderator, findUserRole(b.moderator),"bans"));
  const modLB = Object.values(counts).sort((a,b)=>b.total-a.total);

  const actCounts = {};
  db.logs.forEach(l=>{ actCounts[l.user]=actCounts[l.user]||{name:l.user,role:l.role,count:0}; actCounts[l.user].count++; });
  const actLB = Object.values(actCounts).sort((a,b)=>b.count-a.count);

  function top3Html(arr,valueKey,label){
    const medals=["🥇","🥈","🥉"];
    return `<div class="top3">${arr.slice(0,3).map((e,i)=>`
      <div class="glass top3-card rank${i+1}"><div class="top3-medal">${medals[i]}</div>
      <h4>${e.name}</h4><p>${e.role}</p><div class="top3-num">${e[valueKey]}</div>
      <p>${label}</p></div>`).join("")}</div>`;
  }
  document.getElementById("content").innerHTML = `
  <div class="page-title"><div><h2>🏆 Leaderboard</h2><p>Die aktivsten Teammitglieder im Überblick.</p></div></div>
  <h3 style="margin-bottom:12px;">⚖️ Moderations-Leaderboard</h3>
  ${top3Html(modLB,"total","Aktionen gesamt")}
  <div class="glass" style="padding:20px;margin-bottom:26px;">
    ${tableHtml(["#","Benutzer","Rolle","Warns","Kicks","Bans","Gesamt"],
      modLB.map((e,i)=>`<tr><td>${i+1}</td><td><b>${e.name}</b></td><td><span class="badge ${roleBadgeClass(e.role)}">${e.role}</span></td>
      <td>${e.warns}</td><td>${e.kicks}</td><td>${e.bans}</td><td><b>${e.total}</b></td></tr>`))}
  </div>
  <h3 style="margin-bottom:12px;">🔥 Aktivitäts-Leaderboard</h3>
  ${top3Html(actLB,"count","Aktionen protokolliert")}
  <div class="glass" style="padding:20px;">
    ${tableHtml(["#","Benutzer","Rolle","Anzahl Aktionen"],
      actLB.map((e,i)=>`<tr><td>${i+1}</td><td><b>${e.name}</b></td><td><span class="badge ${roleBadgeClass(e.role)}">${e.role}</span></td><td>${e.count}</td></tr>`))}
  </div>`;
}

  const u = currentUser();
  const username = document.getElementById("nuUser").value.trim();
  const pass = document.getElementById("nuPass").value;
  const role = document.getElementById("nuRole").value;
  if(!username||!pass){ toast("Bitte alle Pflichtfelder ausfüllen.","error"); return; }
  if(!(u.role==="Owner") && roleLevel(role)>=roleLevel(u.role)){ toast("Du darfst keine gleichrangige/höhere Rolle vergeben.","error"); return; }
  const db = loadDB();
  if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase())){ toast("Benutzername existiert bereits.","error"); return; }
  db.users.push({id:uid(),username,passwordHash:await sha256(pass),discord:document.getElementById("nuDiscord").value||"-",
    discordId:document.getElementById("nuDiscordId").value||"-",role,active:true,createdAt:nowDateStr()});
  saveDB(db); addLog(u,"Benutzer erstellt",username);
  closeModal(); toast("Benutzer erfolgreich erstellt"); renderUsers();
}
function openEditUser(id){
  const db = loadDB(); const x = db.users.find(u=>u.id===id); const u = currentUser();
  openModal(`<h3>✏️ Benutzer bearbeiten</h3>
  <div class="form-group"><label>Benutzername</label><input class="input" id="euUser" value="${x.username}"></div>
  <div class="form-group"><label>Neues Passwort (optional)</label><input class="input" type="password" id="euPass" placeholder="Leer lassen = unverändert"></div>
  <div class="form-group"><label>Discord-Name</label><input class="input" id="euDiscord" value="${x.discord}"></div>
  <div class="form-group"><label>Discord-ID</label><input class="input" id="euDiscordId" value="${x.discordId}"></div>
  <div class="form-group"><label>Rolle</label><select class="select" id="euRole">${roleOptions(u,x.role)}</select></div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
  <button class="btn btn-primary" onclick="saveEditUser('${id}')">Speichern</button></div>`);
}
async function saveEditUser(id){
  const db = loadDB(); const x = db.users.find(u=>u.id===id); const u = currentUser();
  const newRole = document.getElementById("euRole").value;
  if(!(u.role==="Owner") && roleLevel(newRole)>=roleLevel(u.role)){ toast("Nicht erlaubt: gleichrangige/höhere Rolle.","error"); return; }
  x.username=document.getElementById("euUser").value; x.discord=document.getElementById("euDiscord").value;
  x.discordId=document.getElementById("euDiscordId").value; x.role=newRole;
  const newPass = document.getElementById("euPass").value;
  if(newPass) x.passwordHash = await sha256(newPass);
  saveDB(db); addLog(u,"Rolle geändert",x.username);
  closeModal(); toast("Benutzer aktualisiert"); renderUsers();
}
function toggleUser(id){
  const db = loadDB(); const x = db.users.find(u=>u.id===id);
  x.active = !x.active; saveDB(db);
  addLog(currentUser(), x.active?"Benutzer aktiviert":"Benutzer deaktiviert", x.username);
  toast(x.active?"Benutzer aktiviert":"Benutzer deaktiviert","info"); renderUsers();
}
function deleteUser(id){
  const db = loadDB(); const x = db.users.find(u=>u.id===id);
  db.users = db.users.filter(u=>u.id!==id); saveDB(db);
  addLog(currentUser(),"Benutzer gelöscht",x?.username||"-");
  toast("Benutzer gelöscht","info"); renderUsers();
}

/* ================= LOGS ================= */
function renderLogs(){
  const db = loadDB();
  let list = db.logs.filter(l=>{
    const f = state.logFilter.toLowerCase();
    return !f || l.user.toLowerCase().includes(f) || l.action.toLowerCase().includes(f) || (l.target||"").toLowerCase().includes(f);
  });
  const rows = paginate(list,state.page.logs,state.PS).map(l=>`
    <tr><td><b>${l.user}</b></td><td><span class="badge ${roleBadgeClass(l.role)}">${l.role}</span></td>
    <td>${l.action}</td><td>${l.target&&l.target!=="-"?l.target:"—"}</td><td>${l.date}</td><td>${l.time}</td></tr>`);
  document.getElementById("content").innerHTML = `
  <div class="page-title"><div><h2>📜 Aktivitätslogs</h2><p>Vollständige, unveränderliche Protokollierung aller wichtigen Aktionen.</p></div></div>
  <div class="glass" style="padding:20px;">
    <div class="toolbar"><input class="input" placeholder="🔍 Benutzer / Aktion / Ziel..." value="${state.logFilter}" oninput="state.logFilter=this.value; state.page.logs=1; renderLogs()"></div>
    ${tableHtml(["Benutzer","Rolle","Aktion","Ziel","Datum","Uhrzeit"],rows)}
    ${paginationHtml(list.length,state.page.logs,state.PS,"gotoPageLogs")}
  </div>`;
}
function gotoPageLogs(p){ state.page.logs=p; renderLogs(); }

/* ================= EINSTELLUNGEN ================= */
function renderSettings(){
  const u = currentUser(); const db = loadDB();
  document.getElementById("content").innerHTML = `
  <div class="page-title"><div><h2>⚙️ Einstellungen</h2><p>Persönliche Kontoeinstellungen.</p></div></div>
  <div class="grid2">
    <div class="glass" style="padding:24px;">
      <h3 style="margin-bottom:16px;">🔑 Passwort ändern</h3>
      <form onsubmit="return changeOwnPassword(event)">
        <div class="form-group"><label>Aktuelles Passwort</label><input class="input" type="password" id="curPass" required></div>
        <div class="form-group"><label>Neues Passwort</label><input class="input" type="password" id="newPass" required></div>
        <div class="form-group"><label>Neues Passwort bestätigen</label><input class="input" type="password" id="newPass2" required></div>
        <button class="btn btn-primary" type="submit">Passwort ändern</button>
      </form>
    </div>
    <div class="glass" style="padding:24px;">
      <h3 style="margin-bottom:16px;">👤 Konto-Informationen</h3>
      <p style="font-size:13.5px;color:var(--dim);line-height:2;">
        Benutzername: <b style="color:#fff;">${u.username}</b><br>
        Rolle: <span class="badge ${roleBadgeClass(u.role)}">${u.role}</span><br>
        Discord: <b style="color:#fff;">${u.discord}</b><br>
        Discord-ID: <b style="color:#fff;">${u.discordId}</b><br>
        Mitglied seit: <b style="color:#fff;">${u.createdAt}</b>
      </p>
    </div>
  </div>
  ${hasFullAccess(u)?`
  <div class="glass" style="padding:24px;margin-top:20px;">
    <h3 style="margin-bottom:14px;">🛠️ Systemeinstellungen</h3>
    <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;">
      <input type="checkbox" ${db.settings.maintenance?"checked":""} onchange="toggleMaintenance(this.checked)"> Wartungsmodus aktivieren
    </label>
  </div>`:""}
  `;
}
async function changeOwnPassword(e){
  e.preventDefault(); const u = currentUser(); const db = loadDB();
  const cur = document.getElementById("curPass").value, n1=document.getElementById("newPass").value, n2=document.getElementById("newPass2").value;
  if(await sha256(cur) !== u.passwordHash){ toast("Aktuelles Passwort ist falsch.","error"); return false; }
  if(n1!==n2){ toast("Neue Passwörter stimmen nicht überein.","error"); return false; }
  if(n1.length<4){ toast("Passwort zu kurz.","error"); return false; }
  const target = db.users.find(x=>x.id===u.id);
  target.passwordHash = await sha256(n1); saveDB(db);
  addLog(u,"Passwort geändert","-");
  toast("Passwort erfolgreich geändert"); e.target.reset(); return false;
}
function toggleMaintenance(val){
  const db = loadDB(); db.settings.maintenance = val; saveDB(db);
  addLog(currentUser(),"Einstellungen geändert","Wartungsmodus: "+(val?"An":"Aus"));
  toast("Einstellung gespeichert");
}

/* ================= INIT ================= */
(async function init(){
  if(!localStorage.getItem("nrhh_db")){ saveDB(await buildSeed()); }
  route();
})();
</script>
</body>
</html>
